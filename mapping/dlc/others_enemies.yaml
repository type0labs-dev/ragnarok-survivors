# Ragnarok Survivors — DLC enemy "de-para" (draft v1, 2026-10-16), six DLCs:
#   moonspell  (Legacy of the Moonspell) MOONSPELL         -> Amatsu / Kunlun / Louyang (yokai, oni)
#   foscari    (Tides of the Foscari)    FOSCARI, FOSCARI2 -> Rachel / Veins / lake + Celtic folklore horror (fairies, fish, Fomorians)
#   chalcedony (Emergency Meeting)       POLUS             -> Juperos / Lighthalzen Bio Lab (robots; impostor = Doppelganger)
#   firstblood (Operation Guns)          FB_GALUGA, FB_HIGHWAY -> Lighthalzen Bio Lab / Juperos (soldiers, chimeras, mechs)
#   emeralds   (Emerald Diorama)         EMERALD           -> Payon / Comodo / Umbala (JRPG diorama beasts; gate bosses = MVPs)
#   lemon      (Ante Chamber)            LEM_CHAMBER       -> Comodo casino (Joker is taken by base EX_CARDSHARP)
# Source: dlc/<DLC>/data/enemyData_*.json + stageData_*.json; family = (textureName, frameNames[0] minus _0.png).
# Same fields as ../enemies.yaml plus `dlc`. scope: dlc. Picks were checked against the actual sprites (UnityPy peek).
# shared_base: true = the family draws from a base atlas sprite already mapped in ../enemies.yaml; the art is
#   shared, so the pick MUST stay identical to the base row (change it there, not here).
# Base-game enemies spawned in DLC stages (ZOMBIE, BAT1-3, BOSS_XLDEATH, EX_CARDSHARP/Joker, EX_SPADEKNIGHT...) are
#   NOT repeated here; they keep their base picks and were counted in the per-stage no-repeat check.
# role: boss when every id is a BOSS_*/stage boss; elite when max hp >= 15; segment = body part; event = breakable prop;
#   projectile = bullet with an enemy row (no RO monster, map in the effects pass).
# ro_ptbr: NOT verified against bRO strings; proper names kept as-is.

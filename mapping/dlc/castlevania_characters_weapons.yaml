# Ragnarok Survivors - Ode to Castlevania DLC (contentGroup THOSE_PEOPLE) -> RO de-para
# Same rules/fields as ../characters_weapons.yaml. RO episode: Glast Heim / Niflheim / Bio Lab dark content.
#  - Belmont clan -> Knight/Royal Guard/Rune Knight family (each a distinct body); whips = melee sweeps.
#  - Belnades/Ecclesia mages -> Wizard/Sage line bodies not used by the base cast (female variants, 3rd/4th jobs).
#  - Vampires/demons/bosses -> RO MVPs and Glast Heim/Bio Lab monsters; fake heroes -> Bio Lab clones (L_*).
#  - Starting weapon = a skill of the character's class (NPC/monster rows are looser, as in base).
#  - Evolutions may cross into the 3rd/4th job of the same line. Store dupes (TP_DARIO/TP_DMITRI in _STORE)
#    share the main rows. ACC familiars (isPowerUp) are under `passives`.
#  - [trad] = our translation; 4th-job skill names are mostly unconfirmed in bRO.
#  - Generated by scratchpad gen_cv.py; edit the YAML directly from now on.

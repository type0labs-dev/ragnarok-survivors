# Ragnarok Survivors - VS -> RO de-para for the "Ode to Castlevania" DLC (internal name ThosePeople, prefix TP_).
# Draft 2026-10-16, generated from the DLC data (enemyData/stageData/musicData/itemData_ThosePeople.json) and bundle
# listings (UnityPy, read-only). Same field formats as ../enemies.yaml, ../stages_music_ui_story.yaml, ../items.yaml.
#
# Episode: Castle Dracula = Glast Heim. Its biomes map to Glast Heim wings, Thanatos Tower (clock tower),
# Niflheim (woods + Death), Geffen Dungeon (Dracula's throne). Profane Chapel = Nameless Island Cursed Abbey.
#
# Notes
#  - Families = (textureName, frameNames[0] prefix), like the base. Textures verified: TP_enemies (tp_enemies bundle),
#    TP_enemiesReuse (tp_enemiesreuse bundle), 2048x2048 each. 'WhiteDot' (vfx placeholder) is split per scripted boss:
#    Legion, Beelzebub, Death, Doppleganger draw from their own bundles (granfaloonlegionbossarena, beelzebub*, tp_death,
#    doppelgangerboss_32x32px).
#  - stages: where the id spawns (stage enemies/bosses/events/pools). ADV = TP_ADV_* ids (adventure mode only).
#    TP_CASTLE also lists 'TP_Malachi' (not in enemyData; typo of TP_MALACHI). BOSS_XLDEATH (Reaper) and the base ids in
#    TP_CASTLE_TEST keep their base picks.
#  - No RO monster twice in TP_CASTLE or TP_CHAPEL, except same-creature texture splits (Slogra x3, Succubus x2,
#    Gaibon fodder/ADV, Persephone/ADV Persephone).
#  - music.clip = core of thosepeople_dynamic_assets_<clip>.bundle holding the loop AudioClip of the playlist
#    (playlist songName -> AudioClip m_Name). Every version of one song shares one RO track. Playlists without a
#    musicData id (BGM_TP_SOH_Credits, BGM_TP_Bloodlines_Mystery, BGM_TP_Bloodlines_Pressure) are not listed.
#  - tilesets: Texture2D names inside the DLC tileset/background bundles. Which otc_001_* / tp_castledracula* tilemap uses
#    which texture was NOT traced; biome assignment is by name. ro maps all checked to have a .gnd.
#  - RO BGM 'NN Title' from the mp3 ID3 tags (01-180); map->track pairs from mp3NameTable.txt.
#  - ro_ptbr: [trad] = our translation, not checked against bRO.


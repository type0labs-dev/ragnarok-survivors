# Ragnarok Survivors - VS -> RO de-para for 6 DLCs: characters, weapons, stages, music, tilesets, items.
# Drafted 2026-10-16. Same rules as ../characters_weapons.yaml (mechanic first, theme second; gameplay numbers unchanged).
#  - Keys: moonspell = Legacy of the Moonspell, foscari = Tides of the Foscari, chalcedony = Emergency Meeting,
#    firstblood = Operation Guns, emeralds = Emerald Diorama, lemon = Ante Chamber.
#  - DLC characters use job bodies NOT in the base cast (other gender, trans/3rd/4th jobs, mounted variants);
#    the starting weapon is a skill of that class; evolution = the next job's skill where possible.
#  - Skill AEGIS ids for 4th jobs (NW_, WH_, MT_, ABR_, IG_, DK_, SHC_, AG_, EM_, TR_, BO_, SP_) are from memory: verify
#    against the client skill table before cooking. Item ids verified in asset-catalog item_db_*.yml.
#  - music.ro = "NN title" when known, else "NN (map)" from mp3NameTable.txt. Every map listed has a .gnd.
#  - Helper ids (*_COUNTER, hidden *_HAZARD, EME_*_RAVE...) point to a parent with '-> ID'.

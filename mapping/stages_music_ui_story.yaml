story:
  text_strategy:
    languages: |
      Rewrite in EN (0) and PT-BR (5) only. For every term we rewrite, copy the EN text into the other 12
      language slots too (so a FR/JA player sees RO English, never a stale VS name). Untouched terms keep all
      14 languages. Do not drop languages from the table (I2Terms keeps the array size).
    rewrite:
      - "Names: weapons, passives, items, characters (charName/surname/prefix), enemies (bName), stages (stageName), arcanas, music titles (musicLang), skins (prefix/suffix)."
      - "Lore-bearing descriptions: stageLang description, enemiesLang bDesc (bestiary), characterLang description where it is flavor, secretLang descriptions (they name VS places/items), adventureLang headers."
      - "Any string that mentions a VS proper noun: automatic dictionary substitution (VS name -> RO name, EN and PT-BR separately, longest-match first), then human pass on the ~20% that read wrong."
    keep:
      - "lang/ UI verbs and menus (906 terms: START, OPTIONS, COLLECTION...) - PT-BR already complete (902/906)."
      - "Glossary (314), onlineLang, partyLang, eventLang (except names), Xbox Achievements (not shown on Switch)."
      - "weaponLang tips ('Ignores: Speed, Duration.') and all mechanical numbers/percentages - gameplay text must match VS behavior exactly."
      - "powerUpLang: keep, or optional light rename to RO stat words (Might->ATK, Armor->DEF, Max Health->MaxHP, Recovery->HP Regen); descriptions stay."
      - "Credits (lang/credits_*): keep every VS credit verbatim; ADD a mod credits block (Ragnarok Survivors mod; RO assets (c) Gravity Co., Ltd. / SoundTeMP BGM) by appending terms or reusing an unused credits_* slot."
    rules:
      - "PT-BR uses bRO official names when they exist (Espadachim, Mago, Prontera, Glast Heim, Satan Morroc); EN uses iRO names."
      - "Never change string format tokens ({0}, <color>, \\n) - copy them through."
      - "Keep length within ~120% of the original in PT-BR boxes (cards/tooltips overflow otherwise)."
  lore_reframe:
    world: "Rune-Midgard. The 'Belpaese family' becomes the adventurers of Prontera (classes from characters_weapons.yaml); the cursed land is the Rune-Midgard of the Ragnarok prophecy."
    vampire_root_of_evil: "VS's unseen vampire/Count -> Satan Morroc (the demon whose rise drives RO's late story); Devil Room = his lair."
    directer: "The Directer (meta author of the stages) -> Loki (trickster god who rewrites fate; enemies.yaml uses M Loki)."
    reaper_red_death: "The Reaper at 30:00 -> Grim Reaper Ankou (enemies.yaml); 'Death comes for everyone at 30 minutes' = 'Ankou vem buscar todos aos 30 minutos'."
    the_ender: "The Ender -> Gloom Under Night (enemies.yaml): the end-of-world MVP."
    the_ending: "'The Ending' / final credits -> 'Ragnarök' - the twilight of the gods; the game title itself is the ending's name."
    eudaimonia_machine: "-> Ymir's Heart, the engine under Juperos/Juno (fits the machine-of-happiness irony)."
    cappella_magna: "-> Glast Heim (fallen kingdom and its church): central hub of secrets."
    lycaeum: "-> Illusion of Under Water (deep-sea set)."
    holy_forbidden_astral_stair: "-> Valhalla and Odin Temple: the climb to the gods (Valkyrie = Sigma)."
    inverse_mode: "'Inverse' -> 'Espelho de Niflheim' (Niflheim Mirror) - world turned to the land of the dead."
    hyper_mode: "keep 'Hyper' (UI term)."
    arcanas: "Arcanas are tarot cards -> RO Cards fit perfectly (name each arcana as an MVP card); coordinate with the items/arcana pass."
    coins_gold: "Gold -> Zeny (UI noun; check every '{0} Gold' string)."
    humor: "VS is full of puns (roast chicken in walls, 'Vempair'). Replace with RO in-jokes (Poring, Jellopy, Kafra, 'Meat' healing item, Deviruchi) instead of translating the VS pun."
  effort:
    # Words = EN words in base-game terms (IDs present in the base *_DATA.json). Hours = one writer, EN+PT-BR.
    - {category: "names (weapons 151 ids, chars 68, enemies ~180 bName, items 107, stages 24, arcanas ~22, music 46, skins)", terms: "~700 short strings", effort: "1.5 days (mostly decided in sibling yaml files; this is transcription + bRO name check)"}
    - {category: stageLang, terms: 69, words: 797, effort: "0.5 day - full rewrite (descriptions are pure lore)"}
    - {category: "enemiesLang bDesc (bestiary)", terms: "~183 descriptions", words: 8182, effort: "3-4 days to translate; RECOMMENDED: write new 1-2 sentence RO flavor per monster (~30 words) = ~5.5k words/lang, 2 days"}
    - {category: characterLang, terms: 222, words: 651, effort: "0.5 day - descriptions are mechanical; only names + flavor lines"}
    - {category: "weaponLang (names + descriptions)", terms: 403, words: 1553, effort: "1 day - descriptions are mechanical, substitution + name pass; tips untouched"}
    - {category: itemLang, terms: 220, words: 929, effort: "0.5 day"}
    - {category: "secretLang (166 secrets)", terms: "~176", words: 1029, effort: "0.5 day - auto-substitution of place/item names covers most; check riddles still make sense"}
    - {category: "achievementLang (213 achievements)", terms: 509, words: 2990, effort: "0.5 day - auto-substitution; mechanical"}
    - {category: "arcanaLang / musicLang / skinLang / eventLang / progressLang", terms: "~560", words: "~3.3k", effort: "1 day (progressLang is DLC adventures - defer)"}
    - {category: "adventureLang + adv_* bundles", terms: 70, words: 394, effort: "defer - adventures shipped here are DLC (adv_chal x7, adv_foscari x5, adv_shemoon x2, adv_deathfight); keep VS text"}
    - {category: credits, terms: "~65", effort: "0.25 day - add mod block only"}
    - {category: "TOTAL base game", words: "~15-20k EN words touched per language (~60% by dictionary substitution)", effort: "~9-11 writer-days for EN+PT-BR"}


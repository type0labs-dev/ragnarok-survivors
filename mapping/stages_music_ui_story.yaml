sfx:
  strategy: |
    187 AudioClips live in data.unity3d/resources.assets with bytes in the LOOSE file Data/resources.resource
    (16.5 MB, FSB5; mostly IMA ADPCM 44.1 kHz). Replace by appending a new FSB5 to resources.resource and
    repointing that AudioClip's m_Resource offset/size (+ m_Length/m_Channels/m_Frequency/m_CompressionFormat)
    with unitypatch.replace_object on resources.assets. Long jingles live in their own bundles (sfx_treasure_*,
    sfx_wind, sfx_geiger*). RO wavs are short PCM .wav at the top of data/wav/ (1962 + subfolder effect/).
    Mix: RO sfx are quieter/low-rate (mostly 22 kHz) - normalize to the VS clip's RMS so balance stays.
    Gameplay-critical feedback (gem pickup, hit) must keep similar length; never make a per-hit clip longer.
  mappings:
    # vs clip                    -> RO wav (data/wav/...)                        notes
    sfx_enemyHit:                {ro: "_enemy_hit_normal1.wav (rotate _2.._4)",  confidence: high}
    sfx_gem:                     {ro: "se_ding1.wav",                            confidence: med, note: "XP gem pickup; very frequent -> keep < 0.3 s"}
    sfx_littlepickup:            {ro: "se_equip_item_01.wav",                    confidence: med}
    sfx_coin_double4:            {ro: "se_get_coin.wav",                         confidence: high}
    sfx_itemDrop:                {ro: "se_equip_item_03.wav",                    confidence: low}
    sfx_levelup:                 {ro: "levelup.wav",                             confidence: high, note: "THE iconic RO level-up"}
    sfx_levelupB:                {ro: "levelup.wav + complete.wav tail",         confidence: med}
    sfx_autoLevel / sfx_autoLB:  {ro: "levelup.wav (shortened)",                 confidence: med}
    sfx_treasure_found / _foundB: {ro: "tming_success.wav",                      confidence: med}
    sfx_treasure_1/2/3 (+B) bundles: {ro: "roulette.wav loop + complete.wav ending, stretched to 9.6/14.6/19.1 s", confidence: med, note: "chest jingle length tracks the chest video; keep durations"}
    sfx_victory1 / sfx_victory2: {ro: "complete.wav / welcome.wav",              confidence: med}
    sfx_gameOver / sfx_gameOverB: {ro: "dying.wav (+ die_male.wav)",             confidence: med}
    sfx_deathscream / sfx_death_4: {ro: "die_male.wav / die_novice_female.wav",  confidence: med}
    sxf_loss:                    {ro: "damage_male.wav",                         confidence: low}
    sfx_potBreak:                {ro: "_stone_explosion.wav",                    confidence: med, note: "brazier/light-source break"}
    sfx_sounds_pause7_in/out, sfx_sounds_interaction13: {ro: "버튼소리.wav (button)",   confidence: high}
    sfx_error13 / sfx_KeyWrong:  {ro: "취소.wav (cancel)",                       confidence: high}
    sfx_titleIntro/B:            {ro: "BGM 01 Title first 5.5 s",                confidence: med}
    sfx_secret:                  {ro: "se_organ01.wav",                          confidence: low}
    sfx_bell2 / belltoll / sfx_evilgong: {ro: "se_prtchbell_01..03.wav (Prontera church bells)", confidence: high}
    sfx_wingsA / sfx_wingsB:     {ro: "monster_feather.wav",                     confidence: med}
    sfx_frostimpact:             {ro: "_frozen_explosion.wav",                   confidence: high}
    sfx_lightningimpact(Low) / sfx_mlightning1: {ro: "chainlight.wav (or effect/ Lord of Vermilion/Thunderstorm - verify)", confidence: med}
    sfx_guns1..3 / sfx_weapon_singleshot*: {ro: "gunfire.wav, _hit_권총.wav (pistol), _hit_샷건.wav (shotgun)", confidence: high}
    sfx_javelin / sfx_javelin2:  {ro: "attack_spear.wav",                        confidence: med}
    sfx_wpn_punch2/4:            {ro: "_hit_fist1..4.wav",                       confidence: high}
    sfx_projectile_magic*:       {ro: "effect/ bolt sounds (Fire/Cold/Lightning Bolt) - verify names in data/wav/effect/", confidence: low}
    sfx_exp* / sfx_explo_*:      {ro: "_stone_explosion.wav, effect/ Meteor Storm/Magnum Break - verify", confidence: low}
    sfx_sounds_powerup2/9/18 / Powerup / sfx_PowerUp12: {ro: "_heal_effect.wav", confidence: med}
    sfx_dice_shake / sfx_wheelOfFortuneTick / _Fanfare: {ro: "roulette.wav / complete.wav", confidence: med}
    Cat1..5 / CatE:              {ro: "se_cat01.wav",                            confidence: med}
    sfx_wind bundle (72 s, Whiteout ambience): {ro: "se_field_wind_01..06.wav looped / se_moc_wind_strong.wav", confidence: med}
    sfx_geiger1..4 bundles:      {ro: "se_machineloop01..03.wav",                confidence: low}
    step01..04:                  {ro: "keep VS (or were_wolf_foot1/2.wav)",      confidence: low}
    glass01..25 / cff_* / sfx_4* (Arcana/character gimmicks): {ro: "defer; map with the weapon/arcana pass", confidence: low}
    weapon_sfx_note: "Per-weapon sfx follow the weapon->skill table in characters_weapons.yaml (attack_whip.wav for Bash/Whip, attack_book.wav for books...)."


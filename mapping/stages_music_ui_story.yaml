# Ragnarok Survivors - VS -> RO de-para: stages, music, sfx, UI/branding, story/text
# Companion: mapping/TECH_NOTES.md (verified formats + risk per replacement).
# Sibling files already decided: characters_weapons.yaml (Antonio=Swordman, Pugnala=Gunslinger,
# Avatar=Baphomet, Sigma=Valkyrie...), enemies.yaml (The Reaper=Grim Reaper Ankou, Directer=M Loki,
# The Ender=Gloom Under Night). This file follows those picks.
#
# Conventions
#  - RO BGM numbers = files in "/mnt/data/games/01 - Ragnarok RE/BGM/NN.mp3"; titles read from each
#    mp3's ID3 tag (verified 2026-10-16). Map->track pairs from data/mp3NameTable.txt (verified).
#    RO mp3s are 22050 Hz stereo ~80 kbps, 60-350 s, loop as whole files.
#  - VS music key -> clip comes from the music-library MonoBehaviour resources.assets path_id 12687
#    (verified string dump). STAGE_DATA.BGM is what plays by default; sideBBGM is the alternate.
#    For FOREST and CHAPEL the default is the *_B key (VS quirk), so read bgm_normal/bgm_b per key.
#  - ro_ground_textures: names under data/texture/필드바닥/ (mojibake on disk: ÇÊµå¹Ù´Ú; decode
#    name.encode('latin1').decode('cp949')) or a map folder under data/texture/. "verify" = folder seen
#    only in a shallow listing, contents not opened.
#  - confidence: high / med / low.


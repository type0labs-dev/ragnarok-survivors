# Ragnarok Survivors - VS -> RO de-para: characters, weapons, passives, shop powerups
# Rules used:
#  - VS gameplay numbers untouched; only names/art/icons/fx/text change.
#  - RO pick chosen by on-screen MECHANIC first, theme second.
#  - Characters: core cast = RO classes (early unlock -> 1st job, later -> 2nd/trans/3rd);
#    odd/secret/joke characters = iconic RO NPCs/monsters. Each keeps its VS starting weapon,
#    whose RO skill is that class's signature where possible. Gender follows the VS character.
#  - Weapons -> RO skills; evolutions -> higher-job/stronger version of the same skill line.
#  - Passives -> RO items (rAthena Id verified against asset-catalog item_db_*.yml).
#  - Shop PowerUps -> RO stats / buffs / skills.
#  - asset: ok = exported sprite exists; str = needs .str conversion from data/texture/effect;
#    missing = no asset (fallback suggested). Many classic skill fx (bolts, Soul Strike, Bash...)
#    are client-hardcoded, hence missing.
#  - ro_ptbr: bRO naming where known; "[trad]" = my translation, not confirmed bRO.
#  - Scope: base game + contentGroup EXTRA. Helper ids (*_COUNTER, *_STATIC*, FOLLOWER_*) point to `parent`.

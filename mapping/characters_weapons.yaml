# Tocador de quadros do hook (tools/rofx.py + ProjectileFx em main.cpp): classe do projétil do VS → animação inteira
# do RO, no lugar da imagem parada. size = lado maior no mundo (px do VS, o do sprite que o prefab usa); field = campo
# do SpriteRenderer no projétil (padrão 0x80 = _renderer; [a, b] = campo b dentro do objeto em a); rot = giro (graus, anti-horário) pra apontar pra direita
# como o sprite do VS; fps do RO = 1000 / (delay do .act × 25 ms); loop: false = toca uma vez e para no último;
# alpha = opacidade imposta no renderer (o VS esmaece alguns, como o anel do Garlic); py = pivô vertical (0 = base);
# hide = [campo, campo] até um SpriteRenderer do VS que é desligado.
ro_fx:
  FireballProjectile: {ref: effect fireball, fps: 10, size: 34, rot: 90}       # Fire Wand → Bola de Fogo
  HellfireProjectile: {ref: effect fireball, fps: 10, size: 44, rot: 90}       # Hellfire (sprite do VS 32×27)
  GarlicWeapon: {ref: str firehit, fps: 12, size: 56, field: 0x158, alpha: 1.0}          # Garlic → anel de fogo (Impacto Explosivo); o anel é da arma
  # PentagramProjectile: VS (Zero, 17/10: sem skill equivalente no RO; o estilhaço de tela do VS fica)
  DiamondProjectile: {ref: str holyhit, fps: 12, size: 28, alpha: 1.0}                 # Runetracer → Luz Divina
  # LightningProjectile: VS por enquanto. O raio é um SpriteScroller (rola no shader, não aceita atlas) e o brilho do
  # chão (_groundFx +0xE8 → +0x28) nasce com escala 0 e alfa 0,15 sob tween; o quadro do RO não apareceu (17/10).
  #   tentativas: field [0xE8, 0x28] e field 0x80 (+ SetActive), ambos com hide [0xD0, 0x40]: no 0x80 só um ponto cinza
  NdujaProjectile: {ref: effect firewall, fps: 10, size: 256, field: 0xD0}     # Nduja → Barreira de Fogo (_GroundFx)

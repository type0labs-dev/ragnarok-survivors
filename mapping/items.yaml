# Ragnarok Survivors — VS -> RO "de-para": pickups, relics, arcanas, props, NPC-like items.
#
# Rules
#  - VS gameplay numbers are untouched; only name, icon, sprite and text change.
#    The RO identity must read as the same mechanic (heal = food/potion, freeze = clock/ice, ...).
#  - Scope: base game + EXTRA = v1. DLC-only (Moonspell/Foscari/Chalcedony/First Blood/Those People)
#    and internal/unnamed entries = later.
#  - ro_ref: rAthena item Id (grepped in asset-catalog/data/ro/item_db_*.yml), NPC sprite folder
#    (ref/ro_npc_sprites.txt), monster sprite (ref/ro_monster_sprites.txt) or effect sprite
#    (ref/ro_effect_sprites.txt). Every Id/folder below was checked to exist.
#  - visual: "icon" = client texture/유저인터페이스/item icon of that Id (assumed present for official items);
#    "drop:<kr>" = exported-sprites/item/<kr> folder that exists. Id<->resname link is inferred by name
#    (no idnum2itemresnametable available here) — confirm before cooking.
#  - asset: ok = file/folder seen; assumed = official icon/cardbmp not listed individually;
#    unverified = expected location not checked; missing = no RO asset found.
#  - ro_ptbr: bRO name when known, otherwise a faithful translation (marked by confidence).
#  - No art copied; this file only points at assets.


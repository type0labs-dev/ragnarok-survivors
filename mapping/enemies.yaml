# Ragnarok Survivors — VS -> RO enemy "de-para" (draft v1)
# Generated from: ref/vs_enemy_families.txt (303 families), rAthena mob_db (ref/ro_mobs.tsv),
# ref/ro_monster_sprites.txt. Gameplay numbers stay VS (HP, speed, damage, spawn tables);
# only sprite, name and bestiary text change.
#
# STAGE -> RO REGION
#   FOREST       Mad Forest      -> Payon Forest fields (pay_fild)
#   LIBRARY      Inlaid Library  -> Glast Heim Castle & Library (+ Moscovia witches as guests)
#   WAREHOUSE    Dairy Plant     -> Einbroch mine / Juperos industrial ruins (knights + aqueduct sea-folk)
#   TOWER        Gallo Tower     -> Clock Tower, Al De Baran (c_tower / alde_dun)
#   CHAPEL       Cappella Magna  -> Nameless Island Cursed Abbey (abbey01-03; Beelzebub)
#   MOLISE       Il Molise       -> Umbala, Utan tribe village
#   SINKING      Moongolow       -> Byalan Island undersea (iz_dun)
#   GREENACRES / STAGEX          -> Prontera fields (only global Familiar appears)
#   BONEZONE     Bone Zone       -> Niflheim
#   RASH         Boss Rash       -> Endless Tower
#   MACHINE      Eudaimonia      -> Juperos core (no own families)
#   WHITEOUT     Whiteout        -> Lutie + Rachel Ice Cave (ice_dun)
#   EX_LYCAEUM   Lycaeum         -> Illusion of Under Water (deep-sea ILL_* mobs)
#   COOP         Coop            -> Prontera Peco Peco farm
#   SPAZIE       Space 54        -> Juperos ruins (Dimik/Venatu/Archdam "aliens")
#   CARLOCART    Carlo Cart      -> Einbroch mine-cart line (reuses racing variants)
#   LABORRATORY  Laborratory     -> Lighthalzen Bio Lab + Kiel Hyre robot factory
#   EX_WESTWOODS Westwoods       -> Rock Ridge (western; Buffalo Bandits)
#   BATCOUNTRY   Bat Country     -> Geffen Dungeon (Dracula)
#   ASTRALSTAIR  Astral Stair    -> Odin Temple / Valhalla
#   EX_MAZERELLA Mazerella       -> Labyrinth Forest (prt_maze; bulls/boars)
#   TOWERBRIDGE  Tower Bridge    -> Amatsu castle bridge (Samurai Specter)
#   DEVILROOM    Devil Room      -> Satan Morroc's lair (DEVIL_HP_1..15 ladder ends at Satan Morroc)
#
# GLOBAL PICKS (families shared across many stages): Bat3->Familiar, Skeleton1->Skeleton,
#   Ghost->Whisper, Mud->Sandman, Mudman1->Poring, Mummy->Mummy, Medusa1->Medusa, Fishman->Merman.
#
# RULES
#   - One RO monster per family; no RO monster reused by two families in the same stage.
#     Known exception: XLDragon1/XLDragon2 exist in two textures (enemies2 + enemies_Universal)
#     = same VS creature, same RO pick on purpose. Racing (CARLOCART) inherits base picks.
#   - Role: fodder (swarm), elite (tanky/XL non-boss), boss (BOSS_*/XL boss/bestiary boss -> MVP or
#     miniboss), event (treasure/special spawn), segment (dragon/kitsune tails), projectile (not a mob).
#   - Boss variants (BOSS_*) of a family share the family sprite; scale them up in-engine.
#   - scope: base = appears in a scoped stage; base-unstaged = boss/event with no stage (Reaper,
#     Stage-Killer cousins, devil ladder...); later = DLC-looking unstaged (EX_*/D_* only) — lower effort.
#   - projectile rows have no RO monster: map them in the effects pass (ref/ro_effect_sprites.txt).
#   - asset: ok = folder present in ro_monster_sprites.txt. Rows with ro_mob_id null use a
#     sprite folder that has no rAthena row (scatleton, skelion, seahores, duckling, ill_ghostring,
#     c_whiteknight, holy_skogul).
#   - ro_ptbr: Portuguese name; proper names kept as-is. NOT verified against bRO client strings —
#     check msgstringtable/bRO mob names before shipping.
#   - why: <=15 words of rationale (+ [MVP] tag when rAthena flags the pick as MVP).
#
# ANIMATION (RO .act, exported as animation.ron; 72 actions = 9 actions x 8 dirs, idx = action*8+dir)
#   action 0 idle, 1 walk, 2 attack, 3 hurt, 4 die.  dir 0 S, 1 SW, 2 W, 3 NW, 4 N, 5 NE, 6 E, 7 SE.
#   ro_anim move -> walk loop (idx 8..15) on one side dir: use dir 6 (E) for "facing right";
#   if its layers are mirror:true use dir 2 (W) and flip in-engine (VS flips by velocity anyway).
#   ro_anim idle -> stationary VS enemies (flower walls, plants, eggs, crystals): action 0.
#   Death: action 4 same dir (VS has death frames). Some MVPs/objects have fewer actions — verify
#   action_count per sprite before cutting.
#   ro_size from mob_db: Large = big sprite (fine for bosses/elite), Small = may need upscale for XL.
#
# Variantes sorteadas pelo jogo (frameNames: SKELETON = Skeleton1..6, ZOMBIE = Ghoul1..3…): a k-ésima variante sem
# linha própria recebe o k-ésimo monstro do pool do ro_sprite da família (Zero, 16/10: "da mesma família mas outros
# monstros"). Sem pool = o mesmo monstro.
ro_variant_overrides:  # variante com monstro fixo (Zero 16/10: Flower2 é planta, não orc zumbi)
  Flower2: mandragora

ro_variant_pools:
  skeleton: [skel_soldier, pirate_skel, sailor_skeleton, skel_prisoner, orc_skeleton, weak_skeleton]  # skel_archer (corpulento) e skel_worker (lampião) destoam
  zombie: [ghoul, zombie_prisoner, orc_zombie, zombie_master, mummy]
  poring: [drops, poporing, marin, metaling]
  poporing: [marin, drops]
  drainliar: [farmiliar, ill_drainliar]
  farmiliar: [drainliar, ill_drainliar]
  whisper: [ghostring, wind_ghost]
  wolf: [desert_wolf, vagabond_wolf, frozenwolf]
  mummy: [ancient_mummy, g_mummy]
  mandragora: [flora, geographer, rafflesia]

